
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "effects_of_noise_in_qfm"
version = "0.2.0"
description = ""
authors = [{ name = "Melvin Strobl", email = "melvin.strobl@kit.edu" }, { name = "Maja Franz", email = "maja.franz@othr.de"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=2.18.0,<3",
    "kedro>=0.19.11,<0.20",
    "kedro-mlflow>=0.14.3,<0.15",
    "kedro-viz>=10.1.0,<11",
    "pandas>=2.2.3,<3",
    "pyyaml>=6.0.2,<7",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.11,<10",
    "mkdocs-glightbox>=0.4.0,<0.5",
    "markdown-include>=0.8.1,<0.9",
    "qml-essentials",
    "jax>=0.9.0.1",
    "optax>=0.2.8",
]

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "1bfa1e5a753af6c56cadc21122b3af14e32dc046" }

[project.scripts]
effects_of_noise_in_qfm = "effects_of_noise_in_qfm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/effects_of_noise_in_qfm"]

[tool.kedro]
package_name = "effects_of_noise_in_qfm"
project_name = "effects_of_noise_in_qfm"
kedro_init_version = "0.19.6"
tools = [ "Testing", "Custom Logging", "Kedro Viz",]
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/effects_of_noise_in_qfm -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [ "pragma: no cover", "raise NotImplementedError",]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.11,<10",
    "mkdocs-glightbox>=0.4.0,<0.5",
    "markdown-include>=0.8.1,<0.9",
]

[tool.kedro_telemetry]
project_id = "9afb68ff0fe045cf975e94fc0ede1279"
