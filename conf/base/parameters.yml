data:
  domain: [-3.1415, 3.1415] # domain of x values
  omegas: 5
  amplitude: "random"
  norm_factor: 0.5
  seed: 1000

model:
  n_qubits: 5
  n_layers: 1
  circuit_type: "Circuit_15" # Circuit_1, Circuit_5, Circuit_9, Circuit_15, Circuit_18, Circuit_19, Hardware_Efficient, Strongly_Entangling, No_Entangling, Strongly_Entangling_Plus
  data_reupload: True
  output_qubit: -1
  initialization: "random" # random, zero, zero-controlled, pi-controlled
  initialization_domain: [0, 6.283185307179586]
  shots: -1 # number or -1 if expectation value should be used
  encoding: ["RY"]
  noise_params:
    GateError: 0.0
    BitFlip: 0.0
    PhaseFlip: 0.0
    AmplitudeDamping: 0.0
    PhaseDamping: 0.0
    Depolarizing: 0.0
    MultiQubitDepolarizing: 0.0
    StatePreparation: 0.0
    Measurement: 0.0
    ThermalRelaxation:
      0.0
      # T1: 18000.0
      # T2: 10000.0
      # t_factor: 5
  noise_steps: 1

seed: 1000

entanglement:
  # Entanglement Params
  measure: "MN" # Entanglement of Formation (EF), Meyer-Wallach (MW), Relative Entropy of Entanglement (RE), Mean Negativity (MN)
  n_samples: 250
  n_sigmas: 5 # Only applies when entanlement.measure = "RE"
  scale: True

expressibility:
  # Expressibility Params
  n_samples: 250
  n_bins: 75
  # 0: evaluate the fidelity distribution at x = 0 (zero-input protocol).
  # n > 0: evaluate it at n evenly spaced inputs over data.domain (one period
  # without the repeated endpoint, so x = 0 is included for even n), with the
  # same parameter samples for every input, and record one value per input.
  n_inputs: 0

coefficients:
  # Coefficients Params
  n_samples: 250
  zero_coefficient: True
  oversampling: 1
  selective_noise: "both" # "both", "iec", "pqc" (where to apply noise)
  scale: True

training:
  steps: 1000
  learning_rate: 0.01
  lr_schedule: "constant" # constant or cosine (cosine decay from learning_rate to learning_rate * lr_decay over all steps)
  lr_decay: 0.01
  metric_steps: 10 # compute expensive metrics (entanglement) only every n steps
  measure: "MN" # Entanglement of Formation (EF), Meyer-Wallach (MW), Mean Negativity (MN)
  loss: "coeff" # mse (training inputs) or coeff (squared complex coefficient error over all frequencies)
  convergence:
    threshold: -1 # threshold for the cost, -1 to disable
    gradient: -1 # threshold for the cost gradient, -1 to disable
    steps: 50 # gradient is checked for the last n steps (mavg)
